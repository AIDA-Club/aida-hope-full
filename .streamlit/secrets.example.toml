# Ask AIDA live assistant settings.
# 1. Copy this file to .streamlit/secrets.toml (that file is git-ignored).
# 2. Replace the placeholders. NEVER commit a real key or paste it anywhere else.
# Without a secrets.toml (or with the placeholders left in), Ask AIDA works
# fully offline using the hand-written answers in kb/fallback_*.md.

# Provider used by the app: "deepseek" or "gemini".
PROVIDER = "deepseek"
API_KEY = "PASTE_YOUR_KEY_HERE"
# DeepSeek example: "deepseek-chat". Gemini example (from Google's docs): "gemini-3.8-flash".
MODEL = "deepseek-chat"
# Optional: override the endpoint. Defaults:
#   deepseek -> https://api.deepseek.com
#   gemini   -> https://generativelanguage.googleapis.com/v1beta/openai/
# BASE_URL = ""

# Optional, for scripts/eval_chat.py only: add a section per provider to
# compare them side by side. Sections with a placeholder key are skipped.
# [deepseek]
# API_KEY = "PASTE_YOUR_KEY_HERE"
# MODEL = "deepseek-chat"
#
# [gemini]
# API_KEY = "PASTE_YOUR_KEY_HERE"
# MODEL = "gemini-3.8-flash"
