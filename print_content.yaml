# All text for the AIDA × Hope printed materials.
# Edit wording here, then rebuild with:  .venv\Scripts\python.exe scripts\build_print.py
#
# Rules for this file:
# - Medical facts come ONLY from approved sources: the "Verified facts" list in
#   OVERNIGHT_TASKS.md, and the researched knowledge base in kb/*.md. For
#   kb/help_uae.md only its CONFIRMED sections count, never "Not yet confirmed".
# - Model numbers come ONLY from data/reports/metrics.json (68 test images).
# - Never add real contact details. Use [TO VERIFY: ...] until the owner checks them.
# - Every Arabic string is a DRAFT and must be reviewed by a native speaker
#   before printing (keys ending in _ar, and the "ar:" blocks).

# true: every PDF carries an "Arabic draft: needs native review" mark next to its Arabic.
# Set to false only after a native speaker has reviewed every Arabic string, then rebuild.
draft_marks: true

meta:
  arabic_review_status: "DRAFT - needs native Arabic review"
  draft_mark: "Arabic draft: needs native review"
  footer: "AIDA × Hope — Educational use only"
  footer_ar: "AIDA × Hope — للاستخدام التعليمي فقط"

# ---------------------------------------------------------------------------
# Staff answer key (answer_key.pdf)
# ---------------------------------------------------------------------------
answer_key:
  header: "STAFF ONLY"
  title: "Booth answer key: 30 challenge cases"
  note: >-
    Keep this sheet behind the table. "Looked in the right place?" compares the
    AI heatmap with the true tumor outline: Yes = overlap of 0.3 or more,
    Partly = 0.1 to under 0.3, No = under 0.1, blank = normal tissue (no tumor
    outline).
  columns: ["Case", "Truth", "AI prediction", "AI confidence", "AI correct?", "Looked in the right place?"]

# ---------------------------------------------------------------------------
# Case cards (case_cards.pdf) — must never show an answer
# ---------------------------------------------------------------------------
case_cards:
  label: "CASE"
  prompt: "Normal, benign or malignant? Decide before the AI does."
  # Small QR line at the bottom of each card; {n} = the card number (1-30).
  phone: "Play this card on your phone: scan the QR, enter card #{n}"
  phone_ar: "العبوا بهذه البطاقة على هواتفكم: امسحوا الرمز وأدخلوا رقم البطاقة {n}"

# ---------------------------------------------------------------------------
# Patient folders (folders.pdf)
# ---------------------------------------------------------------------------
folder_common:
  stamp: "FICTIONAL CASE — FOR EDUCATION ONLY"
  clinic_name: "Hope Fair Teaching Clinic"
  department: "Breast Imaging · Ultrasound"
  folder_label: "PATIENT FOLDER"
  page_titles:
    scan: "The scan"
    ai_report: "AI analysis report"
    real_result: "The real result"
    verdict: "Verdict"
    safeguard: "How a human doctor protects the patient"
  scan_caption: "Breast ultrasound image. Look at it yourself before you turn the page."
  ai_report_fields:
    prediction: "AI prediction"
    confidence: "Model confidence per class"
    heatmap: "Heatmap: where the AI looked"
    recommendation: "Recommendation"
  ai_report_disclaimer: "Generated by an educational AI model. Not a medical device."
  real_result_caption: "Pink line = the real tumor outline, from the dataset. Colours = where the AI looked."
  real_result_caption_normal: "No tumor outline: this is normal tissue. Colours = where the AI looked."
  discussion_label: "Question for you"
  consequences_label: "What this could mean for the patient"
  lesson_label: "What this teaches us"
  fictional_note: >-
    Patient details are invented. The ultrasound image is real and anonymous,
    from a public research dataset.

folders:
  - number: 1
    title: "Confidently wrong"
    case_file: "malignant_id_148.png"
    patient_name: "Mariam K."
    age_range: "45–50"
    scan_reason: "Follow-up of a lump noticed during a routine check"
    ai_recommendation: "Likely benign. Routine follow-up suggested."
    real_result: "Biopsy showed: MALIGNANT (cancer)."
    real_result_detail: >-
      The tumor is the small dark area near the top left. The AI's heatmap is a
      wide band through other tissue and only brushes the tumor's edge.
    verdict: "FALSE NEGATIVE"
    verdict_subtitle: "The AI was 91% sure it was benign. It was cancer."
    consequences:
      - "False reassurance: the patient is told not to worry."
      - "Diagnosis is delayed."
      - "In the meantime the cancer may grow or spread."
      - "It may be found later, when treatment is less likely to succeed."
      - "Confidence is not truth."
    human_safeguard:
      - "Compares this scan with the patient's previous scans."
      - "A second radiologist reads the images independently."
      - "Any lump that worries the doctor goes to biopsy, whatever the software says."
      - "Looks at the whole patient: history, symptoms and examination."
    discussion_question: "The AI was 91% sure. What would make you trust, or doubt, a confident answer?"
    ar:
      verdict: "نتيجة سلبية كاذبة"
      human_safeguard:
        - "يقارن هذه الصورة بصور المريضة السابقة."
        - "يقرأ طبيب أشعة ثانٍ الصور بشكل مستقل."
        - "أي كتلة تُقلق الطبيب تُحال إلى الخزعة، مهما قال البرنامج."
        - "ينظر إلى المريضة ككل: تاريخها الصحي وأعراضها والفحص السريري."

  - number: 2
    title: "Missed cancer"
    case_file: "malignant_id_143.png"
    patient_name: "Fatima A."
    age_range: "55–60"
    scan_reason: "Check of a breast change the patient noticed"
    ai_recommendation: "Likely benign. Routine follow-up suggested."
    real_result: "Biopsy showed: MALIGNANT (cancer)."
    real_result_detail: >-
      The tumor is the dark area in the upper middle. The AI's heatmap is
      below and to the right of it, almost completely missing the tumor.
    verdict: "FALSE NEGATIVE"
    verdict_subtitle: "The AI looked in the wrong place and missed the cancer."
    consequences:
      - "False reassurance: the patient goes home thinking all is well."
      - "Diagnosis is delayed."
      - "The cancer may grow or spread in the meantime."
      - "It may be found later, when treatment is less likely to succeed."
    human_safeguard:
      - "Checks that the area of concern was actually looked at."
      - "A second reader reviews the images."
      - "Arranges follow-up imaging if anything is unclear."
      - "Orders a biopsy when in doubt."
    discussion_question: "The heatmap shows the AI looked in the wrong place. How could a doctor catch this mistake?"
    ar:
      verdict: "نتيجة سلبية كاذبة"
      human_safeguard:
        - "يتأكد من أن المنطقة المثيرة للقلق قد فُحصت فعلاً."
        - "يراجع قارئ ثانٍ الصور."
        - "يطلب تصويراً للمتابعة إذا كان هناك أي غموض."
        - "يطلب خزعة عند الشك."

  - number: 3
    title: "Looked right, judged wrong"
    case_file: "malignant_id_162.png"
    patient_name: "Noura S."
    age_range: "60–65"
    scan_reason: "Scan of a lump found during a clinical breast examination"
    ai_recommendation: "Likely benign. Routine follow-up suggested."
    real_result: "Biopsy showed: MALIGNANT (cancer)."
    real_result_detail: >-
      The tumor is the large dark area. This time the AI's heatmap is right on
      it. The AI looked at the right place, then still said benign (56% benign
      vs 43% malignant).
    verdict: "LOOKED RIGHT, JUDGED WRONG"
    verdict_subtitle: "The AI found the tumor, then misjudged it."
    consequences:
      - "Seeing isn't understanding: looking at the right spot is not enough."
      - "A heatmap on the tumor can make a wrong answer look trustworthy."
      - "56% vs 43% is a close call, but the report only says \"likely benign\"."
      - "For the patient it is still a missed cancer: false reassurance and delay."
    human_safeguard:
      - "Judges the mass itself: its shape, edges and what lies around it."
      - "Treats a borderline result as a reason to look closer, not to relax."
      - "Combines the scan with other tests, such as a mammogram."
      - "Orders a biopsy when in doubt."
    discussion_question: "The AI looked at the right spot but still got it wrong. Does a heatmap prove the AI understood?"
    ar:
      verdict: "نظر إلى المكان الصحيح، وأخطأ الحكم"
      human_safeguard:
        - "يحكم على الكتلة نفسها: شكلها وحوافها وما حولها."
        - "يعتبر النتيجة المتقاربة سبباً للتدقيق أكثر، لا للاطمئنان."
        - "يجمع بين الصورة وفحوص أخرى، مثل صورة الثدي الشعاعية (الماموغرام)."
        - "يطلب خزعة عند الشك."

  - number: 4
    title: "False alarm"
    case_file: "benign_id_373.png"
    patient_name: "Aisha R."
    age_range: "30–35"
    scan_reason: "Follow-up of a lump noticed by the patient"
    ai_recommendation: "Suspicious for malignancy. Biopsy recommended."
    real_result: "Biopsy showed: BENIGN (not cancer)."
    real_result_detail: >-
      The lump is the dark oval inside the pink line. The white "+" marks and
      numbers are measurement marks added by the person who scanned it. The
      AI's hottest area is beside the lump, and its warm area also covers some
      of those marks.
    verdict: "FALSE POSITIVE"
    verdict_subtitle: "The AI raised the alarm. It was not cancer."
    consequences:
      - "Fear and anxiety for the patient and family."
      - "Extra scans and an unnecessary biopsy."
      - "Cost and lost time."
      - "Busier clinics: every false alarm takes time from other patients."
    human_safeguard:
      - "Compares with previous scans to see whether anything has changed."
      - "Looks at the lump's features, not just the software's score."
      - "A second reader can avoid an unnecessary biopsy."
      - "Explains the result calmly and clearly to the patient."
    discussion_question: "Nothing was missed here. Is a false alarm harmless? Who pays the cost?"
    ar:
      verdict: "نتيجة إيجابية كاذبة"
      human_safeguard:
        - "يقارن بالصور السابقة ليرى إن كان شيء قد تغيّر."
        - "ينظر إلى خصائص الكتلة، لا إلى درجة البرنامج فقط."
        - "يمكن لقارئ ثانٍ أن يجنّب المريضة خزعة غير ضرورية."
        - "يشرح النتيجة للمريضة بهدوء ووضوح."

  - number: 5
    title: "Right answer, wrong reason"
    case_file: "malignant_id_180.png"
    patient_name: "Hessa M."
    age_range: "50–55"
    scan_reason: "Further imaging after a change in breast shape"
    ai_recommendation: "Suspicious for malignancy. Biopsy recommended."
    real_result: "Biopsy showed: MALIGNANT (cancer)."
    real_result_detail: >-
      The tumor is inside the pink line on the right. The AI's heatmap is
      hottest on a different dark area to the left. The answer was right, but
      the AI was mostly looking somewhere else.
    verdict: "RIGHT ANSWER, WRONG REASON"
    verdict_subtitle: "Correct (89% malignant), but mostly looking away from the tumor."
    consequences:
      - "Being right doesn't mean reasoning well."
      - "An AI that is right for the wrong reason can fail on the next patient."
      - "Checking only whether answers are right can hide this problem."
      - "This is why we look at heatmaps, and why we still need experts."
    human_safeguard:
      - "Checks where the finding really is, not just the final label."
      - "A second reader reviews the images."
      - "Confirms the diagnosis with a biopsy."
      - "Looks at the whole patient before deciding on next steps."
    discussion_question: "The AI got the right answer. Should we still worry about where it looked?"
    ar:
      verdict: "إجابة صحيحة، لسبب خاطئ"
      human_safeguard:
        - "يتحقق من مكان العلامة الحقيقي، لا من التصنيف النهائي فقط."
        - "يراجع قارئ ثانٍ الصور."
        - "يؤكد التشخيص بالخزعة."
        - "ينظر إلى المريضة ككل قبل تحديد الخطوات التالية."

  - number: 6
    title: "AI got it right"
    case_file: "malignant_id_153.png"
    patient_name: "Layla H."
    age_range: "65–70"
    scan_reason: "Scan of a lump noticed during self-examination"
    ai_recommendation: "Suspicious for malignancy. Biopsy recommended."
    real_result: "Biopsy showed: MALIGNANT (cancer)."
    real_result_detail: >-
      The tumor is the dark area inside the pink line. The AI's heatmap sits
      on the tumor and the answer was right. This is what helpful AI looks like.
    verdict: "AI GOT IT RIGHT"
    verdict_subtitle: "Right answer, right place: 99% malignant, heatmap on the tumor."
    consequences:
      - "AI can help: it flagged the cancer and pointed to the right area."
      - "A highlight like this can help doctors decide where to look first."
      - "Cancers found early are more likely to be treated successfully."
      - "Even here, the biopsy, not the AI, confirmed the diagnosis."
    human_safeguard:
      - "Uses the AI's highlight as a second opinion, not the final word."
      - "Confirms with a biopsy."
      - "Looks at the whole patient and talks through next steps with her."
    discussion_question: "When the AI is right, does the doctor still need to check? Why?"
    ar:
      verdict: "أصاب الذكاء الاصطناعي"
      human_safeguard:
        - "يستخدم إشارة الذكاء الاصطناعي كرأي ثانٍ، لا ككلمة أخيرة."
        - "يؤكد التشخيص بالخزعة."
        - "ينظر إلى المريضة ككل ويناقش معها الخطوات التالية."

# ---------------------------------------------------------------------------
# "How to read a breast ultrasound" tips card (tips_card.pdf, A5, EN front / AR back)
# ---------------------------------------------------------------------------
tips_card:
  en:
    title: "How to read a breast ultrasound"
    subtitle: "Five simple clues for the challenge"
    tips:
      - "The image is a slice through the breast. Dark areas can be fluid, fat or a mass; brighter areas are denser tissue."
      - "A dark blob may be a mass. Many masses are benign (not cancer)."
      - "Smooth, oval edges, and wider than tall: more often benign."
      - "Irregular or spiky edges, taller than wide, or a dark shadow underneath: more suspicious."
      - "No obvious mass at all: it may be normal tissue."
    footer: "Simplified tips for a game. Only trained doctors can interpret real scans."
    diagram_left: "Smooth, oval, wider than tall:\nmore often benign"
    diagram_right: "Irregular, taller than wide, shadow:\nmore suspicious"
  ar:
    title: "كيف تقرؤون صورة الموجات فوق الصوتية للثدي"
    subtitle: "خمسة مفاتيح بسيطة للتحدي"
    tips:
      - "الصورة شريحة عبر الثدي. المناطق الداكنة قد تكون سوائل أو دهوناً أو كتلة، والمناطق الأفتح أنسجة أكثر كثافة."
      - "البقعة الداكنة قد تكون كتلة. كثير من الكتل حميدة (ليست سرطاناً)."
      - "حواف ناعمة بيضاوية، والعرض أكبر من الطول: غالباً حميدة."
      - "حواف غير منتظمة أو مسنّنة، أو الطول أكبر من العرض، أو ظل داكن تحتها: أكثر إثارة للشك."
      - "لا توجد كتلة واضحة: قد يكون نسيجاً طبيعياً."
    footer: "نصائح مبسّطة للعبة فقط. الأطباء المدرَّبون وحدهم يستطيعون قراءة الصور الحقيقية."
    diagram_left: "ناعمة بيضاوية، العرض أكبر من الطول:\nغالباً حميدة"
    diagram_right: "غير منتظمة، الطول أكبر من العرض، مع ظل:\nأكثر إثارة للشك"

# ---------------------------------------------------------------------------
# Take-home card (takehome_cards.pdf, 85×55 mm)
# ---------------------------------------------------------------------------
takehome:
  qr_url: "https://aidaxhope.streamlit.app/"
  placeholder_label: "PLACEHOLDER QR"
  en:
    title: "Know Your Normal"
    signs_heading: "See a doctor if you notice:"
    signs:
      - "A lump or thickening, often painless"
      - "A change in breast size, shape or look"
      - "Dimpling, redness or other skin changes"
      - "A change in the nipple or the skin around it"
      - "Unusual or bloody fluid from the nipple"
    reassurance: "Most lumps are not cancer, but any change is worth checking with a doctor."
    men: "Men can get breast cancer too (rare)."
    qr_caption: "Scan to play & ask AIDA"
  ar:
    title: "اعرفوا ما هو طبيعي لكم"
    signs_heading: "راجعوا الطبيب عند ملاحظة:"
    signs:
      - "كتلة أو سماكة، غالباً بلا ألم"
      - "تغيّر في حجم الثدي أو شكله أو مظهره"
      - "تنقّر أو احمرار أو تغيّرات أخرى في الجلد"
      - "تغيّر في الحلمة أو الجلد المحيط بها"
      - "إفرازات غير طبيعية أو دموية من الحلمة"
    reassurance: "معظم الكتل ليست سرطاناً، لكن أي تغيّر يستحق الفحص عند الطبيب."
    men: "الرجال أيضاً قد يُصابون بسرطان الثدي (نادراً)."
    qr_caption: "امسحوا الرمز للعب وسؤال AIDA"

# ---------------------------------------------------------------------------
# Poster (poster_A2.pdf)
# ---------------------------------------------------------------------------
poster:
  en:
    headline: "Can you beat the AI?"
    station_message: "AI helps doctors. It doesn't replace them."
    steps_heading: "How it works"
    steps:
      - "Look at a real breast ultrasound and make your call: normal, benign or malignant."
      - "See what the AI predicted, and where it looked."
      - "Reveal the truth and find out who got it right."
    model_line: "In testing on 68 images, our AI caught 21 of 24 cancers, and missed 3."
    model_note: "It also raised 3 false alarms. 68 images is a small test, so treat these numbers with care."
    confusion_caption: "How the AI did on the 68 test images (rows: truth, columns: AI)."
    heatmap_caption: "Heatmaps show where the AI looked. Sometimes it is the right place, sometimes not."
    theme: "Every story is unique, every journey matters. (WHO Breast Cancer Awareness Month 2026)"
    disclaimer: "Educational demonstration only. Not for diagnosis."
  ar:
    headline: "هل تستطيعون التفوق على الذكاء الاصطناعي؟"
    station_message: "الذكاء الاصطناعي يساعد الأطباء، ولا يحلّ محلهم."
    steps_heading: "كيف تعمل التجربة"
    steps:
      - "انظروا إلى صورة حقيقية بالموجات فوق الصوتية للثدي واتخذوا قراركم: طبيعي أو حميد أو خبيث."
      - "شاهدوا توقّع الذكاء الاصطناعي، وأين نظر."
      - "اكشفوا الحقيقة واعرفوا من أصاب."
    model_line: "في اختبار على 68 صورة، اكتشف نموذجنا 21 من 24 حالة سرطان، وفاتته 3."
    model_note: "وأعطى أيضاً 3 إنذارات كاذبة. 68 صورة اختبار صغير، فتعاملوا مع هذه الأرقام بحذر."
    theme: "لكل قصة تفرّدها، ولكل رحلة أهميتها. (شهر التوعية بسرطان الثدي 2026، منظمة الصحة العالمية)"
    disclaimer: "عرض توضيحي تعليمي فقط. ليس للتشخيص."
  qr_label: "Scan to play & ask AIDA"
  qr_label_ar: "امسحوا الرمز للعب وسؤال AIDA"
  credits_heading: "Credits"
  organisers: "AIDA Club × IEEE AU Student Cabinet · Hope Fair, Ajman University, 15 October 2026"

